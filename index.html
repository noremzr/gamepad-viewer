<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minimalist OBS Overlay (Auto Switch Fixed)</title>
  <style>
    :root {
      --bg-color: rgba(18, 18, 22, 0.9);
      --border-color: rgba(255, 255, 255, 0.12);
      --key-bg: rgba(255, 255, 255, 0.05);
      --key-text: #e2e8f0;
      --active-color: #00f2fe;
      --active-text: #000;
      --active-glow: 0 0 12px rgba(0, 242, 254, 0.6);
    }

    body {
      margin: 0;
      padding: 15px;
      background: transparent;
      color: var(--key-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      overflow: hidden;
    }

    .layout {
      display: none;
      background: var(--bg-color);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      width: fit-content;
      gap: 10px;
      align-items: center;
    }

    .layout.active {
      display: flex !important;
    }

    .key {
      background: var(--key-bg);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      height: 30px;
      min-width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 10px;
      box-sizing: border-box;
      transition: all 0.06s ease;
    }

    .keyboard-grid { display: flex; flex-direction: column; gap: 3px; }
    .row { display: flex; gap: 3px; }

    .w-tab { width: 40px; }
    .w-shift { width: 48px; }
    .w-ctrl, .w-win, .w-alt { width: 35px; }
    .w-space { width: 118px; }

    .mouse-wrapper {
      border-left: 1px solid var(--border-color);
      padding-left: 8px;
      margin-left: 2px;
      display: flex;
      align-items: center;
    }

    .mouse-body {
      width: 52px;
      height: 82px;
      border: 2px solid var(--border-color);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      align-items: center;
    }

    .mouse-buttons {
      display: flex;
      width: 100%;
      height: 32px;
      border-bottom: 1px solid var(--border-color);
    }

    .m-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
    }

    .m-btn.left { border-right: 1px solid var(--border-color); border-top-left-radius: 22px; }
    .m-btn.right { border-top-right-radius: 22px; }

    .mouse-joystick-base {
      position: absolute;
      bottom: 10px;
      width: 28px;
      height: 28px;
      border: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mouse-joystick-dot {
      width: 8px;
      height: 8px;
      background: var(--active-color);
      border-radius: 50%;
      box-shadow: var(--active-glow);
      transition: transform 0.05s ease-out, opacity 0.2s;
      opacity: 0.4;
    }

    /* ESTILOS CONTROLE */
    .gamepad-wrapper { position: relative; width: 310px; height: 200px; }
    .controller-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; fill: rgba(0,0,0,0.3); stroke: var(--border-color); stroke-width: 2px; }
    .gp-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 16px; box-sizing: border-box; }
    .gp-row { display: flex; justify-content: space-between; align-items: center; }
    .triggers { padding: 0 12px; }
    .trigger-btn { height: 22px; width: 34px; font-size: 9px; border-radius: 3px; }
    .center-btns { justify-content: center; gap: 16px; margin-top: -6px; }
    .dpad, .face-buttons { display: grid; grid-template-columns: repeat(3, 26px); grid-template-rows: repeat(3, 26px); gap: 2px; }
    .dpad .key, .face-buttons .key { height: 26px; min-width: 26px; border-radius: 50%; font-size: 10px; }
    .sticks { justify-content: space-around; padding: 0 45px; margin-bottom: 8px; }
    .stick-base { width: 44px; height: 44px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.4); border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
    .stick-dot { width: 16px; height: 16px; background: var(--active-color); border-radius: 50%; position: absolute; top: 14px; left: 14px; box-shadow: var(--active-glow); }
    .stick-label { font-size: 8px; font-weight: bold; opacity: 0.5; pointer-events: none; }

    .pressed {
      background: var(--active-color) !important;
      color: var(--active-text) !important;
      border-color: var(--active-color) !important;
      box-shadow: var(--active-glow);
    }
  </style>
</head>
<body>

  <!-- TECLADO + MOUSE -->
  <div id="keyboard-layout" class="layout active">
    <div class="keyboard-grid">
      <div class="row">
        <div class="key" id="k-2">1</div>
        <div class="key" id="k-3">2</div>
        <div class="key" id="k-4">3</div>
        <div class="key" id="k-5">4</div>
        <div class="key" id="k-6">5</div>
      </div>
      <div class="row">
        <div class="key w-tab" id="k-15">TAB</div>
        <div class="key" id="k-16">Q</div>
        <div class="key" id="k-17">W</div>
        <div class="key" id="k-18">E</div>
        <div class="key" id="k-19">R</div>
        <div class="key" id="k-20">T</div>
      </div>
      <div class="row">
        <div class="key" id="k-30">A</div>
        <div class="key" id="k-31">S</div>
        <div class="key" id="k-32">D</div>
        <div class="key" id="k-33">F</div>
        <div class="key" id="k-34">G</div>
      </div>
      <div class="row">
        <div class="key w-shift" id="k-42">SHIFT</div>
        <div class="key" id="k-44">Z</div>
        <div class="key" id="k-45">X</div>
        <div class="key" id="k-46">C</div>
        <div class="key" id="k-48">B</div>
      </div>
      <div class="row">
        <div class="key w-ctrl" id="k-29">CTRL</div>
        <div class="key w-win" id="k-3675">WIN</div>
        <div class="key w-alt" id="k-56">ALT</div>
        <div class="key w-space" id="k-57">SPACE</div>
      </div>
    </div>

    <div class="mouse-wrapper">
      <div class="mouse-body">
        <div class="mouse-buttons">
          <div class="m-btn left" id="m-1">LMB</div>
          <div class="m-btn right" id="m-2">RMB</div>
        </div>
        <div class="mouse-joystick-base">
          <div class="mouse-joystick-dot" id="mouse-dot"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTROLE -->
  <div id="gamepad-layout" class="layout">
    <div class="gamepad-wrapper">
      <svg class="controller-svg" viewBox="0 0 310 200">
        <path d="M 60,15 C 100,10 210,10 250,15 C 285,18 305,45 300,85 C 295,125 270,195 240,195 C 220,195 205,160 185,130 Q 155,115 125,130 C 105,160 90,195 70,195 C 40,195 15,125 10,85 C 5,45 25,18 60,15 Z" />
      </svg>
      <div class="gp-layer">
        <div class="gp-row triggers">
          <div class="row" style="gap:2px;"><div class="key trigger-btn" id="btn-6">L2</div><div class="key trigger-btn" id="btn-4">L1</div></div>
          <div class="row" style="gap:2px;"><div class="key trigger-btn" id="btn-5">R1</div><div class="key trigger-btn" id="btn-7">R2</div></div>
        </div>
        <div class="gp-row center-btns">
          <div class="key" id="btn-8" style="font-size: 8px; width: 36px; height: 16px;">SHARE</div>
          <div class="key" id="btn-9" style="font-size: 8px; width: 36px; height: 16px;">OPTIONS</div>
        </div>
        <div class="gp-row">
          <div class="dpad">
            <div></div><div class="key" id="btn-12">↑</div><div></div>
            <div class="key" id="btn-14">←</div><div></div><div class="key" id="btn-15">→</div>
            <div></div><div class="key" id="btn-13">↓</div><div></div>
          </div>
          <div class="face-buttons">
            <div></div><div class="key" id="btn-3">Y</div><div></div>
            <div class="key" id="btn-2">X</div><div></div><div class="key" id="btn-1">B</div>
            <div></div><div class="key" id="btn-0">A</div><div></div>
          </div>
        </div>
        <div class="gp-row sticks">
          <div class="stick-base key" id="btn-10">
            <span class="stick-label">L3</span>
            <div class="stick-dot" id="dot-left"></div>
          </div>
          <div class="stick-base key" id="btn-11">
            <span class="stick-label">R3</span>
            <div class="stick-dot" id="dot-right"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const kbLayout = document.getElementById('keyboard-layout');
    const gpLayout = document.getElementById('gamepad-layout');
    const mouseDot = document.getElementById('mouse-dot');

    let currentMode = 'keyboard';
    let mouseTimeout;
    let lastX = null, lastY = null;
    const maxRadius = 8;

    function setMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;
      if (mode === 'keyboard') {
        kbLayout.classList.add('active');
        gpLayout.classList.remove('active');
      } else {
        gpLayout.classList.add('active');
        kbLayout.classList.remove('active');
      }
    }

    // WEBSOCKET (TECLADO + MOUSE)
    const socket = new WebSocket('ws://localhost:8080');

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'keydown') {
        setMode('keyboard');
        const el = document.getElementById(`k-${data.keycode}`);
        if (el) el.classList.add('pressed');
      } 
      else if (data.type === 'keyup') {
        const el = document.getElementById(`k-${data.keycode}`);
        if (el) el.classList.remove('pressed');
      } 
      else if (data.type === 'mousedown') {
        setMode('keyboard');
        const el = document.getElementById(`m-${data.button}`);
        if (el) el.classList.add('pressed');
      } 
      else if (data.type === 'mouseup') {
        const el = document.getElementById(`m-${data.button}`);
        if (el) el.classList.remove('pressed');
      } 
      else if (data.type === 'mousemove') {
        if (lastX === null || lastY === null) {
          lastX = data.x;
          lastY = data.y;
          return;
        }

        let dx = data.x - lastX;
        let dy = data.y - lastY;
        lastX = data.x;
        lastY = data.y;

        // Só altera para teclado se houver movimento relevante de mouse
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
          setMode('keyboard');
          const distance = Math.hypot(dx, dy);
          const clampedDistance = Math.min(distance, maxRadius);
          const moveX = (dx / distance) * clampedDistance;
          const moveY = (dy / distance) * clampedDistance;

          mouseDot.style.transform = `translate(${moveX}px, ${moveY}px)`;
          mouseDot.style.opacity = '1';

          clearTimeout(mouseTimeout);
          mouseTimeout = setTimeout(() => {
            mouseDot.style.transform = 'translate(0px, 0px)';
            mouseDot.style.opacity = '0.4';
          }, 150);
        }
      }
    };

    // LEITURA NATIVA DO CONTROLE (GAMEPAD API)
    function pollGamepad() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      let activeGamepad = null;

      for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i]) {
          activeGamepad = gamepads[i];
          break;
        }
      }

      if (activeGamepad) {
        let hasInput = false;

        // Leitura de Botões
        activeGamepad.buttons.forEach((btn, idx) => {
          const el = document.getElementById(`btn-${idx}`);
          if (btn.pressed) {
            hasInput = true;
            if (el) el.classList.add('pressed');
          } else {
            if (el) el.classList.remove('pressed');
          }
        });

        // Leitura de Analógicos (Deadzone 0.22)
        const deadZone = 0.22;
        const leftX = Math.abs(activeGamepad.axes[0]) > deadZone ? activeGamepad.axes[0] : 0;
        const leftY = Math.abs(activeGamepad.axes[1]) > deadZone ? activeGamepad.axes[1] : 0;
        const rightX = Math.abs(activeGamepad.axes[2]) > deadZone ? activeGamepad.axes[2] : 0;
        const rightY = Math.abs(activeGamepad.axes[3]) > deadZone ? activeGamepad.axes[3] : 0;

        if (leftX || leftY || rightX || rightY) {
          hasInput = true;
        }

        // Troca o modo apenas se algum botão/analógico do controle for acionado
        if (hasInput) {
          setMode('gamepad');
        }

        document.getElementById('dot-left').style.transform = `translate(${leftX * 13}px, ${leftY * 13}px)`;
        document.getElementById('dot-right').style.transform = `translate(${rightX * 13}px, ${rightY * 13}px)`;
      }

      requestAnimationFrame(pollGamepad);
    }

    requestAnimationFrame(pollGamepad);
  </script>
</body>
</html>
